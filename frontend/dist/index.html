  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      (function() {
        try {
          var t = localStorage.getItem('autotali_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <style>#app-splash{z-index:99999;background:#08080a;flex-direction:column;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;transition:opacity .45s cubic-bezier(.4,0,.2,1),visibility .45s;display:flex;position:fixed;inset:0}#app-splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}.splash-content{text-align:center;flex-direction:column;align-items:center;animation:.6s cubic-bezier(.16,1,.3,1) forwards splashPop;display:flex}@keyframes splashPop{0%{opacity:0;transform:scale(.92)translateY(8px)}to{opacity:1;transform:scale(1)translateY(0)}}.splash-title{letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#fff 40%,#93c5fd 100%);-webkit-text-fill-color:transparent;-webkit-background-clip:text;margin-bottom:4px;font-size:2.1rem;font-weight:900}.splash-subtitle{letter-spacing:.05em;color:#ffffff73;margin-bottom:24px;font-size:.82rem;font-weight:500}.splash-bar-track{background:#ffffff1a;border-radius:4px;width:190px;height:3px;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px #00000080}.splash-bar-fill{background:#fff;border-radius:4px;width:0%;height:100%;animation:8s linear forwards fillLoader;box-shadow:0 0 10px #ffffffd9,0 0 20px #fff6}@keyframes fillLoader{0%{width:0%}to{width:100%}}.splash-percentage{letter-spacing:.06em;color:#ffffffb3;font-variant-numeric:tabular-nums;margin-top:10px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace,sans-serif;font-size:.75rem;font-weight:600}.splash-sound-btn{letter-spacing:.04em;color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;background:#ffffff14;border:1px solid #ffffff38;border-radius:24px;align-items:center;gap:6px;margin-top:16px;padding:7px 16px;font-family:inherit;font-size:.76rem;font-weight:600;transition:all .2s cubic-bezier(.16,1,.3,1);display:inline-flex;box-shadow:0 4px 16px #0006}.splash-sound-btn:hover{background:#ffffff29;border-color:#ffffff61;transform:translateY(-1px)}.splash-sound-btn:active{background:#ffffff3d;transform:scale(.96)}.splash-sound-btn.playing{color:#10b981;background:#10b98124;border-color:#10b98173}</style>
    <script type="module" crossorigin src="/assets/index-Kk63IXc9.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-8FyZ_7xj.css">
  </head>
  <body>
    <!-- App Opening Splash Loader -->
    <div id="app-splash">
      <div class="splash-content">
        <h1 class="splash-title">AutoTali</h1>
        <p class="splash-subtitle">By sushishy</p>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
        <div id="splash-percentage" class="splash-percentage">0%</div>

        <!-- Dedicated Sound Button (works on phones & desktop) -->
        <button id="splash-sound-btn" class="splash-sound-btn" type="button" title="Enable loader audio">
          <span id="splash-sound-icon">🔊</span>
          <span id="splash-sound-text">Sound On</span>
        </button>
      </div>
    </div>

    <!-- Direct Loader Audio Element -->
    <audio id="loader-audio-el" src="/sounds/loader-screen.mp3" autoplay playsinline preload="auto"></audio>

    <div id="root"></div>

    <script>
      // Smooth continuous percentage loader synced across 8 seconds with direct loader-screen audio
      (function() {
        const duration = 8000;
        const startTime = performance.now();
        const percentEl = document.getElementById('splash-percentage');
        const splashEl = document.getElementById('app-splash');
        const loaderAudio = document.getElementById('loader-audio-el');
        const soundBtn = document.getElementById('splash-sound-btn');
        const soundText = document.getElementById('splash-sound-text');
        const soundIcon = document.getElementById('splash-sound-icon');

        const isMuted = (() => {
          try {
            return localStorage.getItem('autotali_sound_muted') === 'true';
          } catch {
            return false;
          }
        })();

        function setSoundActiveUI() {
          if (soundBtn) {
            soundBtn.classList.add('playing');
            if (soundText) soundText.textContent = 'Playing';
            if (soundIcon) soundIcon.textContent = '🎵';
          }
        }

        function enableSound() {
          if (!loaderAudio) return;
          loaderAudio.muted = false;
          loaderAudio.volume = 0.8;
          loaderAudio.play().then(() => {
            setSoundActiveUI();
          }).catch(() => {});
        }

        if (soundBtn) {
          if (isMuted) {
            if (soundText) soundText.textContent = 'Muted';
            if (soundIcon) soundIcon.textContent = '🔇';
          }

          soundBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            enableSound();
          });
          soundBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            enableSound();
          });
        }

        if (loaderAudio) {
          loaderAudio.volume = 0.8;
          if (isMuted) {
            loaderAudio.muted = true;
            loaderAudio.pause();
          } else {
            // Attempt immediate playback (succeeds on desktop or if user previously interacted)
            const playPromise = loaderAudio.play();
            if (playPromise !== undefined) {
              playPromise.then(() => {
                setSoundActiveUI();
              }).catch(() => {
                // Mobile browser policy requires user tap on Sound On button
              });
            }
          }
        }

        function stopLoaderAudio() {
          if (loaderAudio) {
            try {
              loaderAudio.pause();
              loaderAudio.currentTime = 0;
            } catch (e) {}
          }
        }

        function updateLoader(now) {
          const elapsed = now - startTime;
          const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
          if (percentEl) {
            percentEl.textContent = progress + '%';
          }

          if (elapsed < duration) {
            requestAnimationFrame(updateLoader);
          } else {
            if (percentEl) percentEl.textContent = '100%';
            stopLoaderAudio();
            if (splashEl) {
              splashEl.classList.add('fade-out');
              setTimeout(() => {
                splashEl.remove();
                if (loaderAudio) loaderAudio.remove();
              }, 500);
            }
          }
        }
        requestAnimationFrame(updateLoader);
      })();
    </script>
  </body>
</html>
