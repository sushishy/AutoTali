<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AutoTali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('autotali_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <style>#app-splash{z-index:99999;background:#08080a;flex-direction:column;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;transition:opacity .45s cubic-bezier(.4,0,.2,1),visibility .45s;display:flex;position:fixed;inset:0}#app-splash.fade-out{opacity:0;visibility:hidden;pointer-events:none}.splash-content{text-align:center;flex-direction:column;align-items:center;animation:.6s cubic-bezier(.16,1,.3,1) forwards splashPop;display:flex}@keyframes splashPop{0%{opacity:0;transform:scale(.92)translateY(8px)}to{opacity:1;transform:scale(1)translateY(0)}}.splash-title{letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#fff 40%,#93c5fd 100%);-webkit-text-fill-color:transparent;-webkit-background-clip:text;margin-bottom:4px;font-size:2.1rem;font-weight:900}.splash-subtitle{letter-spacing:.05em;color:#ffffff73;margin-bottom:24px;font-size:.82rem;font-weight:500}.splash-bar-track{background:#ffffff1a;border-radius:4px;width:190px;height:3px;position:relative;overflow:hidden;box-shadow:inset 0 1px 2px #00000080}.splash-bar-fill{background:#fff;border-radius:4px;width:0%;height:100%;animation:8s linear forwards fillLoader;box-shadow:0 0 10px #ffffffd9,0 0 20px #fff6}@keyframes fillLoader{0%{width:0%}to{width:100%}}.splash-percentage{letter-spacing:.06em;color:#ffffffb3;font-variant-numeric:tabular-nums;margin-top:10px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,monospace,sans-serif;font-size:.75rem;font-weight:600}</style>
    <script type="module" crossorigin src="/assets/index-B51820BP.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D_FXbbbS.css">
  </head>
  <body>
    <!-- App Opening Splash Loader -->
    <div id="app-splash">
      <div class="splash-content">
        <h1 class="splash-title">AutoTali</h1>
        <p class="splash-subtitle">by sushimightbesoshy</p>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
        <div id="splash-percentage" class="splash-percentage">0%</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Smooth continuous percentage loader synced across 8 seconds with loader-screen audio
      (function() {
        const duration = 8000;
        const startTime = performance.now();
        const percentEl = document.getElementById('splash-percentage');
        const splashEl = document.getElementById('app-splash');
        let loaderAudio = null;

        try {
          loaderAudio = new Audio('/sounds/loader-screen.mp3');
          loaderAudio.volume = 0.7;
          const playPromise = loaderAudio.play();
          if (playPromise !== undefined) {
            playPromise.catch(() => {
              // Browser may restrict autoplay before user gesture; play upon first touch/click
              const onFirstGesture = () => {
                if (loaderAudio && !loaderAudio.ended && splashEl && !splashEl.classList.contains('fade-out')) {
                  loaderAudio.play().catch(() => {});
                }
                window.removeEventListener('pointerdown', onFirstGesture);
                window.removeEventListener('click', onFirstGesture);
              };
              window.addEventListener('pointerdown', onFirstGesture);
              window.addEventListener('click', onFirstGesture);
            });
          }
        } catch (e) {}

        function stopLoaderAudio() {
          if (loaderAudio) {
            try {
              loaderAudio.pause();
              loaderAudio.currentTime = 0;
            } catch (e) {}
            loaderAudio = null;
          }
        }

        function updateLoader(now) {
          const elapsed = now - startTime;
          const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
          if (percentEl) {
            percentEl.textContent = progress + '%';
          }

          if (elapsed < duration) {
            requestAnimationFrame(updateLoader);
          } else {
            if (percentEl) percentEl.textContent = '100%';
            stopLoaderAudio();
            if (splashEl) {
              splashEl.classList.add('fade-out');
              setTimeout(() => splashEl.remove(), 500);
            }
          }
        }
        requestAnimationFrame(updateLoader);
      })();
    </script>
  </body>
</html>
