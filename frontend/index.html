<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AutoTali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('autotali_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #08080a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.45s ease;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: splashPop 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes splashPop {
        0% { opacity: 0; transform: scale(0.92) translateY(8px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .splash-title {
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
        margin-bottom: 4px;
        background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-subtitle {
        font-size: 0.82rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 24px;
      }
      .splash-bar-track {
        width: 190px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: #ffffff;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.85), 0 0 20px rgba(255, 255, 255, 0.4);
        animation: fillLoader 8s linear forwards;
      }
      @keyframes fillLoader {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .splash-percentage {
        margin-top: 10px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.7);
        font-variant-numeric: tabular-nums;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
      }
      .splash-sound-btn {
        margin-top: 16px;
        font-family: inherit;
        font-size: 0.76rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.22);
        padding: 7px 16px;
        border-radius: 24px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        user-select: none;
      }
      .splash-sound-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.38);
        transform: translateY(-1px);
      }
      .splash-sound-btn:active {
        transform: scale(0.96);
        background: rgba(255, 255, 255, 0.24);
      }
      .splash-sound-btn.playing {
        border-color: rgba(16, 185, 129, 0.45);
        background: rgba(16, 185, 129, 0.14);
        color: #10b981;
      }
    </style>
  </head>
  <body>
    <!-- App Opening Splash Loader -->
    <div id="app-splash">
      <div class="splash-content">
        <h1 class="splash-title">AutoTali</h1>
        <p class="splash-subtitle">By sushishy</p>
        <div class="splash-bar-track">
          <div class="splash-bar-fill"></div>
        </div>
        <div id="splash-percentage" class="splash-percentage">0%</div>

        <!-- Dedicated Sound Button (works on phones & desktop) -->
        <button id="splash-sound-btn" class="splash-sound-btn" type="button" title="Enable loader audio">
          <span id="splash-sound-icon">🔊</span>
          <span id="splash-sound-text">Sound On</span>
        </button>
      </div>
    </div>

    <!-- Direct Loader Audio Element -->
    <audio id="loader-audio-el" src="/sounds/loader-screen.mp3" autoplay playsinline preload="auto"></audio>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      // Smooth continuous percentage loader synced across 8 seconds with direct loader-screen audio
      (function() {
        const duration = 8000;
        const startTime = performance.now();
        const percentEl = document.getElementById('splash-percentage');
        const splashEl = document.getElementById('app-splash');
        const loaderAudio = document.getElementById('loader-audio-el');
        const soundBtn = document.getElementById('splash-sound-btn');
        const soundText = document.getElementById('splash-sound-text');
        const soundIcon = document.getElementById('splash-sound-icon');

        const isMuted = (() => {
          try {
            return localStorage.getItem('autotali_sound_muted') === 'true';
          } catch {
            return false;
          }
        })();

        function setSoundActiveUI() {
          if (soundBtn) {
            soundBtn.classList.add('playing');
            if (soundText) soundText.textContent = 'Playing';
            if (soundIcon) soundIcon.textContent = '🎵';
          }
        }

        function enableSound() {
          if (!loaderAudio) return;
          loaderAudio.muted = false;
          loaderAudio.volume = 0.8;
          loaderAudio.play().then(() => {
            setSoundActiveUI();
          }).catch(() => {});
        }

        if (soundBtn) {
          if (isMuted) {
            if (soundText) soundText.textContent = 'Muted';
            if (soundIcon) soundIcon.textContent = '🔇';
          }

          soundBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            enableSound();
          });
          soundBtn.addEventListener('touchend', function(e) {
            e.stopPropagation();
            enableSound();
          });
        }

        if (loaderAudio) {
          loaderAudio.volume = 0.8;
          if (isMuted) {
            loaderAudio.muted = true;
            loaderAudio.pause();
          } else {
            // Attempt immediate playback (succeeds on desktop or if user previously interacted)
            const playPromise = loaderAudio.play();
            if (playPromise !== undefined) {
              playPromise.then(() => {
                setSoundActiveUI();
              }).catch(() => {
                // Mobile browser policy requires user tap on Sound On button
              });
            }
          }
        }

        function stopLoaderAudio() {
          if (loaderAudio) {
            try {
              loaderAudio.pause();
              loaderAudio.currentTime = 0;
            } catch (e) {}
          }
        }

        function updateLoader(now) {
          const elapsed = now - startTime;
          const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);
          if (percentEl) {
            percentEl.textContent = progress + '%';
          }

          if (elapsed < duration) {
            requestAnimationFrame(updateLoader);
          } else {
            if (percentEl) percentEl.textContent = '100%';
            stopLoaderAudio();
            if (splashEl) {
              splashEl.classList.add('fade-out');
              setTimeout(() => {
                splashEl.remove();
                if (loaderAudio) loaderAudio.remove();
              }, 500);
            }
          }
        }
        requestAnimationFrame(updateLoader);
      })();
    </script>
  </body>
</html>
